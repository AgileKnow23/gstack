# Fixture: a filled repo-map.yml for the pilot repository (Outcome Focus).
#
# This is the ONLY project-specific file in an icm-repo-workspace scaffold. The
# other five files are copied from the skill's templates unchanged, which is what
# the walk test exercises: one reusable engine, one project-specific config.
#
# Trimmed to what the walk test needs. A real repository would carry more domains
# and more sources of truth; nothing about the shape changes when it does.

schema: icm-repo-workspace/v1

repo:
  name: outcome-focus
  form: composed
  entry: AGENTS.md

sources_of_truth:
  - path: CLAUDE.md
    holds: domain terminology, bounded contexts, working agreements
    read_when: before naming anything, or when unsure which layer a term belongs to
  - path: docs/domain-model.md
    holds: the aggregates and invariants behind each bounded context
    read_when: changing business rules rather than wiring
  - path: docs/rls-policies.md
    holds: how tenant isolation is enforced at the database
    read_when: any change that reads or writes tenant-scoped data
  - path: docs/decisions/DECISIONS.md
    holds: what was decided and why, with links to the ADRs
    read_when: about to re-litigate a decision that already has an answer

domains:
  - name: crm-core
    paths:
      - src/features/customers
      - src/features/jobs
    doc: docs/domain-model.md
    risk:
      - tenant_isolation
  - name: communications
    paths:
      - src/features/communications
    risk:
      - tenant_isolation
      - externally_reachable
  - name: billing
    paths:
      - src/features/billing
    risk:
      - billing
      - tenant_isolation
  - name: tenants
    paths:
      - src/features/tenants
      - src/features/auth
    doc: docs/rls-policies.md
    risk:
      - auth
      - tenant_isolation

commands:
  install: npm install
  build: npm run build
  test: npm run test
  lint: npm run lint
  e2e: npx playwright test
  dev_url: http://localhost:8080

gates:
  - id: deploy
    when: any deployment, release, or production configuration change
    requires: explicit user authorization, every time — prior approval never carries forward
    self_clearable: false
  - id: migration
    when: any change under supabase/migrations
    requires: owner approval before the migration is applied to a shared database
    self_clearable: false

risk_markers:
  tenant_isolation:
    - tenant_id
    - rls
    - supabase/migrations
  auth:
    - src/features/auth
    - supabase/functions/_shared
  billing:
    - src/features/billing
    - stripe
  externally_reachable:
    - supabase/functions

routing_overrides: []
